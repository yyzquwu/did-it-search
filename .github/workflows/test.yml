name: Search conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pi-extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pi: ["1.5.1", "1.6.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.pi == '1.5.1' && '22.19.0' || '24' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep strace
      - if: runner.os == 'Windows'
        run: if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep -y }
      - run: node --test tests/pi-hook.test.mjs tests/pi-diagnose.test.mjs
      - name: Run native Pi grep and verify ignored file contents stay unread
        shell: bash
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          host="$RUNNER_TEMP/did-it-search-pi"
          npm install --prefix "$host" --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION"
          node tests/pi-integration.mjs --pi-root "$host" --audit-reads
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.15"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - if: runner.os == 'Linux'
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - if: runner.os == 'Windows'
        run: if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep -y }
      - run: python -m pip install .
      - run: python -I -m unittest discover -s tests
      - run: did-it-search demo
      - name: Verify the installed explain quickstart
        shell: python
        run: |
          import json
          import subprocess
          cmd = ["did-it-search", "explain", "createGrepTool", "src/diditsearch", "--json"]
          for flags, code, status in [(["--glob", "*.rs"], 1, "no_files"), ([], 0, "matched")]:
              run = subprocess.run(cmd + flags, capture_output=True, text=True, timeout=30)
              assert run.returncode == code, (run.stdout, run.stderr)
              assert json.loads(run.stdout)["status"] == status, run.stdout
      - run: did-it-search check --json
      - name: Replay Pi's two pinned commits
        if: matrix.python == '3.12'
        run: did-it-search replay pi
      - name: Record a consumer baseline
        if: github.event_name == 'push' && matrix.python == '3.12'
        run: |
          mkdir consumer-project
          cd consumer-project
          npm install --prefix . --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.1
          did-it-search baseline
      - name: Run the composite action as a consumer
        if: github.event_name == 'push' && matrix.python == '3.12'
        uses: ./
        with:
          project-dir: consumer-project
          baseline: consumer-project/.did-it-search.json
      - name: Verify the consumer Python after the Action
        if: github.event_name == 'push' && matrix.python == '3.12'
        run: python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
