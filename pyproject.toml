[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "did-it-search"
version = "0.1.0"
description = "Conformance fixtures for the answers repository search tools give coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
did-it-search = "diditsearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
