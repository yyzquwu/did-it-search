name: Did It Search?
description: Compare the consumer project's installed Pi grep against a reviewed search baseline.
inputs:
  project-dir:
    description: Checkout-relative directory with the installed Pi npm package. Install the project's dependencies and put Node.js 22.19+ and ripgrep on PATH before this action.
    required: false
    default: '.'
  baseline:
    description: Checkout-relative baseline path. On pull_request, read this path from the base SHA in Git history (use checkout with fetch-depth 0). On other events, read it from the current checkout.
    required: false
    default: .did-it-search.json
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.11'
    - name: Compare installed Pi search
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DIDITSEARCH_PROJECT_DIR: ${{ inputs.project-dir }}
        DIDITSEARCH_BASELINE: ${{ inputs.baseline }}
        DIDITSEARCH_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: python -I -X utf8 "$GITHUB_ACTION_PATH/.github/run-action.py"
